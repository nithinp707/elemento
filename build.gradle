// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlin_version = "2.2.20"
        versionCode_prod = 2
        versionName_prod = "1.0"
        database_version_prod = '1'
    }
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // Google services
        classpath 'com.google.gms:google-services:4.4.4'
        // Firebase crashlytics
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
        // Firebase performance monitor
        classpath 'com.google.firebase:perf-plugin:2.0.1'
        // Jetpack navigation component
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.9.5"
        // Jetpack navigation component
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.9.5"
        // Hilt-dependency injection
        classpath "com.google.dagger:hilt-android-gradle-plugin:2.57.2"
    }
}

tasks.register("clean", Delete) {
    delete(rootProject.layout.buildDirectory)
}

tasks.register("testClasses") {
    doLast {
        println("Stub for testClasses – Android projects don’t use this task.")
    }
}
