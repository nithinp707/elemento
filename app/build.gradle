plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.dagger.hilt.android'
    id("com.apollographql.apollo3") version "3.8.2"
}

android {
    namespace "com.zenora.elemento"
    compileSdkVersion 36
    buildToolsVersion "35.0.0"

    defaultConfig {
        multiDexEnabled true
        applicationId "com.zenora.elemento"
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName "1.4"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    signingConfigs {
        release {
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            testProguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguardTest-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
    flavorDimensions "default"
    productFlavors {
        dev {
            versionName "DEV 1.0"
            versionCode 1
        }
        qc {
            versionName "QC 1.0"
            versionCode 1
        }
        uat {
            versionName "UAT 1.0"
            versionCode 1
        }
        prod {
            versionName rootProject.ext.versionName_prod
            versionCode rootProject.ext.versionCode_prod
        }
    }
    apollo {
        service("service") {
            packageName.set("com.zenora.elemento")
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // --- UPDATE CORE & UI DEPENDENCIES ---
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // --- FIREBASE (Use the latest BOM) ---
    implementation platform('com.google.firebase:firebase-bom:33.3.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-perf-ktx'
    implementation 'com.google.firebase:firebase-messaging' // Version is managed by BOM

    // --- RETROFIT & OKHTTP (Update to latest) ---
    def retrofit_version = "3.0.0" // This version is still widely used and stable
    def ok_http_version = "5.2.1" // Update OkHttp
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.okhttp3:okhttp:$ok_http_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$ok_http_version"

    // --- NAVIGATION (Update to latest stable) ---
    def navigation_version = "2.9.5"
    implementation "androidx.navigation:navigation-fragment-ktx:$navigation_version"
    implementation "androidx.navigation:navigation-ui-ktx:$navigation_version"

    // --- LIFECYCLE (Update and remove deprecated artifacts) ---
    def lifecycle_version = "2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    // --- HILT (Update to a modern version) ---
    def hilt_version = "2.57.2"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"

    //koin
    def koin_version = "3.0.1"
    // Koin main features for Android (Scope,ViewModel ...)
    implementation "io.insert-koin:koin-android:$koin_version"

    // --- OTHERS ---
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // This commons-io is very old. Update if possible or verify it's still needed.
    implementation 'commons-io:commons-io:2.20.0'

    // --- TESTING ---
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Apollo GraphQL
    implementation("com.apollographql.apollo3:apollo-runtime:3.8.2")
    implementation 'com.apollographql.apollo:apollo-coroutines-support:2.5.14'
}